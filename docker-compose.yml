# Production-style run of the app: postgres + the Dockerfile's runner stage (migrate deploy at start).
#   cp .env.example .env   # then set real secrets
#   docker compose up -d --build
# The app listens on 127.0.0.1:${APP_PORT:-9105}. The runner has no dev dependencies, so seed demo data from a
# development checkout against this database (`DATABASE_URL=… node prisma/seed.js`), not from this container.
volumes:
  postgres_data:
  app_var:

services:
  postgres:
    image: postgres:17-alpine
    container_name: booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-booking_appointment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-booking_appointment}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 9105
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-booking_appointment}?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-booking_appointment}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:9105}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:9105}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      BATCH_SCHEDULER: ${BATCH_SCHEDULER:-on}
      BOOKING_WINDOW_DAYS: ${BOOKING_WINDOW_DAYS:-30}
      NOTIFY_TRANSPORT: ${NOTIFY_TRANSPORT:-fake}
      NOTIFY_OUTBOX_DIR: /app/var/outbox
      EXPORT_DIR: /app/var/export
      PHOTO_DIR: /app/var/photos
      X3_SOURCE: ${X3_SOURCE:-}
      X4_SOURCE: ${X4_SOURCE:-fixture}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      LINE_LOGIN: ${LINE_LOGIN:-fake}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      X1_WEBHOOK_SECRET: ${X1_WEBHOOK_SECRET:-}
    volumes:
      - app_var:/app/var
      - ./fixtures:/app/fixtures:ro
    ports:
      - "127.0.0.1:${APP_PORT:-9105}:9105"
